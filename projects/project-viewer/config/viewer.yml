glossary:
  - id: G-source
    term: 진실원
    easy: 뷰어가 보여 주는 내용의 원래 자리. 코드·문서·위키·상태 원장만 해당한다. 뷰어의 산출물과 `viewer.yml`의 해설은 진실원이 될 수 없다
    evidence: [{source: design, at: "용어"}]
  - id: G-shell
    term: 셸
    easy: 이 프로젝트의 `config/shell/` — React + Vite 앱 한 벌. 모든 뷰어가 공유한다
    evidence: [{source: design, at: "용어"}]
  - id: G-mid
    term: 중간 파일
    easy: 프로젝트마다 하나 두는 `viewer.yml`. 원본 목록, 해설, 화면 구성을 담는다
    evidence: [{source: design, at: "용어"}]
  - id: G-pointer
    term: 포인터
    easy: "원본을 가리키기만 하는 필드 (`sources`, `evidence`, `detail`)"
    evidence: [{source: design, at: "용어"}]
  - id: G-narrative
    term: 해설
    easy: 원본을 쉬운 말로 다시 쓴 파생 서술. 항목마다 근거가 있어야 한다
    evidence: [{source: design, at: "용어"}]
  - id: G-evidence
    term: 근거 참조
    easy: 해설 항목에서 원본의 특정 위치로 가는 포인터. 네 형태만 허용한다
    evidence: [{source: design, at: "용어"}]
  - id: G-ledger
    term: 상태 원장
    easy: 단계·항목의 상태를 적는 프로젝트 소유 문서(`status.yml`). 뷰어는 읽기만 한다
    evidence: [{source: design, at: "용어"}]
  - id: G-block
    term: 블록
    easy: 페이지를 이루는 단위. 프로젝트의 개념이 아니라 데이터의 모양(그래프, 순서, 단계, 항목, 표 …)이다
    evidence: [{source: design, at: "용어"}]
  - id: G-stamp
    term: 스탬프
    easy: 산출물에 자동으로 찍히는 빌드 시각·커밋·문서 지문·경고 수
    evidence: [{source: design, at: "용어"}]
  - id: G-paper
    term: 종이 이식
    easy: 기존 뷰어를 `viewer.yml`로만 써 보는 검증. 빌드하지 않는다
    evidence: [{source: design, at: "용어"}]

pages:
  - id: P-overview
    title: 개요
    blocks:
      - type: prose
        id: B-overview-prose
        title: 이 뷰어는 무엇인가
        evidence: [{source: design, at: "목적과 범위"}, {source: design, at: "화면 구성"}]
        text: |
          **목적**: 뷰어를 만들 때마다 같은 문제(md 렌더, 링크 해석, 근거 연결, 신선도, 단계 상태)를 새로 풀지 않게 한다. 한 벌의 셸이 그 문제를 한 번만 풀고, 규칙은 지침이 아니라 빌드 실패로 강제한다.
          **범위**: 읽기 전용 뷰어. 아키텍처 그림, 용어 정리, 원본 md 리더(내비게이터 포함), 프로젝트 단계·상태 표시.

          **상단 메뉴** — `pages` 순서대로, 끝에 `용어`와 `원본`을 항상 붙인다. 검색은 페이지·용어·원본 본문을 한꺼번에 찾는다.
          **하단 스탬프** — 빌드 시각, 볼트 커밋(`dirty` 여부), 문서 수, 경고 수, yml 지문. 경고가 있으면 눌러서 목록을 펼친다.
          **근거 패널** — 해설 항목을 누르면 열린다. "상태 출처"와 "상세 원문"을 나눠 보여 주고, 버튼은 리더의 해당 절로 이동한다.
      - type: table
        id: B-overview-table
        title: 읽는 사람별 추천 순서
        intro: 처음 여는 사람, 뷰어를 만들 사람, 진행을 검토할 사람이 각각 먼저 볼 페이지가 다르다.
        evidence: [{source: view-guide, at: "읽는 순서"}]
        columns:
          - {id: audience, label: 읽는 사람}
          - {id: order, label: 추천 순서, derived: true}
        rows:
          - id: ov-new
            cells:
              audience: 처음 보는 사람
              order: 구조 → 빌드 흐름 → 단계
          - id: ov-builder
            cells:
              audience: 뷰어를 만들 사람
              order: 진실원 규칙 → 구조 → 빌드 흐름
          - id: ov-reviewer
            cells:
              audience: 진행을 검토할 사람
              order: 단계 → 발견 → 결정

  - id: P-architecture
    title: 구조
    blocks:
      - type: graph
        id: B-graph
        title: 전체 구성
        intro: "데이터 흐름은 한 방향이다: 원본 → (`viewer.yml`이 가리킴) → `check` → `build` → 단일 HTML. 뷰어에서 원본으로 돌아가는 쓰기 경로는 없다."
        evidence: [{source: design, at: "구성 단위"}]
        groups:
          - {id: GR-source, label: 원본}
          - {id: GR-mid, label: 중간 파일}
          - {id: GR-shell, label: 셸}
          - {id: GR-output, label: 산출물}
        nodes:
          - id: N-docs
            label: 원본 문서·코드·위키
            group: GR-source
            easy: 뷰어가 보여 주는 내용의 원래 자리. 코드·문서·위키·상태 원장만 해당한다. 뷰어의 산출물과 `viewer.yml`의 해설은 진실원이 될 수 없다
            evidence: [{source: design, at: "용어"}]
          - id: N-ledger
            label: 상태 원장
            group: GR-source
            easy: 단계·항목의 상태를 적는 프로젝트 소유 문서(`status.yml`). 뷰어는 읽기만 한다
            evidence: [{source: design, at: "용어"}]
          - id: N-yml
            label: 중간 파일 (viewer.yml)
            group: GR-mid
            easy: 원본 목록, 해설, 페이지·블록 구성
            evidence: [{source: design, at: "구성 단위"}]
          - id: N-model
            label: model
            group: GR-shell
            easy: yml 파싱·스키마 검증·근거 참조 해소·상태 규칙. React·Vite 없이 도는 순수 함수 + `check` CLI
            evidence: [{source: design, at: "구성 단위"}]
          - id: N-loader
            label: loader
            group: GR-shell
            easy: "`sources`의 원본을 빌드 때 읽어 가상 모듈로 주입, 스탬프 생성. 디스크에 생성물을 남기지 않는다"
            evidence: [{source: design, at: "구성 단위"}]
          - id: N-reader
            label: reader
            group: GR-shell
            easy: md 렌더, 내비게이터, 목차, 링크 해석
            evidence: [{source: design, at: "구성 단위"}]
          - id: N-blocks
            label: blocks
            group: GR-shell
            easy: 블록 렌더(그래프, 포함 관계, 순서, 단계, 항목, 표, mermaid, 짧은 해설)와 근거 패널
            evidence: [{source: design, at: "구성 단위"}]
          - id: N-app
            label: 앱 골격
            group: GR-shell
            easy: 해시 라우터, 상단 메뉴, 검색, 하단 스탬프, 테마
            evidence: [{source: design, at: "구성 단위"}]
          - id: N-skill
            label: 스킬
            group: GR-shell
            easy: 만드는 절차(`project-viewer-build`)와 여는 절차(`project-viewer-open`)
            evidence: [{source: design, at: "구성 단위"}]
          - id: N-html
            label: 단일 HTML
            group: GR-output
            easy: "산출물은 `projects/<name>/outputs/viewer/index.html` 단일 파일이고 커밋한다. 빌드 없이 `file://`로 열린다."
            evidence: [{source: design, at: "빌드와 산출물"}]
        edges:
          - {from: N-yml, to: N-docs, label: 가리킴, style: dashed}
          - {from: N-docs, to: N-loader, label: 빌드 때 읽힘}
          - {from: N-yml, to: N-ledger, label: 가리킴, style: dashed}
          - {from: N-ledger, to: N-model, label: 읽힘}
          - {from: N-yml, to: N-model, label: 파싱}
          - {from: N-model, to: N-loader, label: check 통과 후 수집}
          - {from: N-loader, to: N-reader, label: 주입}
          - {from: N-loader, to: N-blocks, label: 주입}
          - {from: N-reader, to: N-app, label: 구성}
          - {from: N-blocks, to: N-app, label: 구성}
          - {from: N-app, to: N-html, label: 빌드}
          - {from: N-skill, to: N-yml, label: 만드는 절차, style: dashed}
      - type: tree
        id: B-tree
        title: 셸 디렉터리 포함 관계
        evidence: [{source: design, at: "구성 단위"}, {source: implementation-plan, at: "파일 지도"}]
        nodes:
          - {id: T-shell, label: "config/shell/"}
          - {id: T-model, label: "model/", parent: T-shell}
          - {id: T-loader, label: "loader/", parent: T-shell}
          - {id: T-src, label: "src/", parent: T-shell}
          - {id: T-tests, label: "tests/", parent: T-shell}
          - {id: T-app, label: "app/", parent: T-src}
          - {id: T-reader, label: "reader/", parent: T-src}
          - {id: T-blocksdir, label: "blocks/", parent: T-src}
          - {id: T-styles, label: "styles/", parent: T-src}
          - {id: T-tests-model, label: "model/", parent: T-tests}
          - {id: T-tests-loader, label: "loader/", parent: T-tests}
          - {id: T-tests-ui, label: "ui/", parent: T-tests}
          - {id: T-tests-fixtures, label: "fixtures/", parent: T-tests}

  - id: P-flow
    title: 빌드 흐름
    blocks:
      - type: sequence
        id: B-seq
        title: yml 작성부터 브라우저 실측까지
        intro: "명령: `node cli.ts check <프로젝트 디렉터리>`, `node cli.ts build <…>`, `node cli.ts dev <…>`. 볼트 루트는 프로젝트 디렉터리에서 위로 올라가며 `VAULT_RULES.md`를 찾아 정한다."
        evidence: [{source: design, at: "빌드와 산출물"}]
        steps:
          - id: SEQ-yml
            label: yml 작성
            lane: 사람
            easy: "`projects/<name>/config/viewer.yml`을 스키마(`docs/schema.md`)에 맞춰 쓴다."
            evidence: [{source: skill-build, at: "3. viewer.yml 작성"}]
          - id: SEQ-check
            label: check
            lane: 검사기
            easy: "`check`는 빌드 앞에서 항상 돌고, 단독으로도 실행할 수 있다."
            evidence: [{source: design, at: "검사 규칙"}]
          - id: SEQ-collect
            label: 원본 수집
            lane: 로더
            easy: "`sources`의 원본을 빌드 때 읽어 가상 모듈로 주입, 스탬프 생성."
            evidence: [{source: design, at: "구성 단위"}]
          - id: SEQ-stamp
            label: 스탬프
            lane: 로더
            easy: 스탬프는 전부 자동이다. 손으로 쓰는 날짜는 없다. 커밋되지 않은 변경이 있는 상태에서 빌드하면 `dirty`가 붙는다.
            evidence: [{source: design, at: "빌드와 산출물"}]
          - id: SEQ-html
            label: 단일 HTML
            lane: Vite
            easy: 산출물은 `projects/<name>/outputs/viewer/index.html` 단일 파일이고 커밋한다.
            evidence: [{source: design, at: "빌드와 산출물"}]
          - id: SEQ-verify
            label: 브라우저 실측
            lane: 코디네이터
            easy: 산출 HTML을 `file://`과 정적 서버 양쪽에서 연다.
            evidence: [{source: supervision, at: "G3 브라우저 실측"}]

  - id: P-rules
    title: 진실원 규칙
    blocks:
      - type: items
        id: B-rules-items
        title: 규칙
        expect_count: 5
        items:
          - id: R-tiers
            label: 필드 3등급
            tags: [포인터, 해설, 상태]
            body: "`viewer.yml`의 필드는 세 등급으로 나뉘고 스키마가 강제한다."
            fields:
              - label: 포인터
                text: 원본을 가리키기만 한다. 빌드 때 전부 해소하고, 해소하지 못하면 빌드가 실패한다.
              - label: 해설
                text: 허용하되 항목마다 근거 참조가 있어야 한다. 자기 근거가 없는 항목은 블록의 근거를 물려받고, 물려받은 사실은 화면과 스탬프에 드러난다(정밀도를 부풀리지 않기 위해서다). 둘 다 없으면 빌드가 실패한다.
              - label: 상태
                text: 상태 값은 `viewer.yml`에 적을 수 없다. 스키마가 거부한다. 상태는 `sources`에 등록된 원본에서만 읽는다.
            evidence: [{source: design, at: "진실원 규칙"}]
          - id: R-evref
            label: 근거 참조 4형태
            tags: [포인터, 검사]
            body: '`at`·`lines`·`find`는 함께 쓸 수 없다. `find`는 코드펜스 안도 찾는다. 해소 결과는 "가장 가까운 위쪽 헤딩의 슬러그 + 줄 번호"다. 화면은 그 절로 이동한다.'
            fields:
              - label: "{source}"
                text: 문서 전체
              - label: '{source, at: "헤딩 문구"}'
                text: 그 절 (권장)
              - label: '{source, lines: "40-52"}'
                text: 줄 범위
              - label: '{source, find: "문자열"}'
                text: 본문 조각
            evidence: [{source: design, at: "근거 참조 형식"}, {source: schema, at: "근거 참조"}]
          - id: R-inherit
            label: 물려받기
            tags: [해설]
            body: '해설 필드가 하나라도 있는 항목은 근거가 있어야 한다. 자기 `evidence`가 없으면 블록의 `evidence`를 물려받는다. 둘 다 없으면 오류다. 물려받은 항목은 화면에서 "블록 근거"로 표시되고, 그 수가 스탬프의 `inheritedEvidence`에 집계된다. 페이지 단위 근거를 항목마다 복제해 정밀도를 부풀리지 말고 물려받게 둔다.'
            evidence: [{source: schema, at: "근거 필수 규칙과 물려받기"}]
          - id: R-checks
            label: 검사 실패/경고
            tags: [검사]
            body: "`check`는 빌드 앞에서 항상 돌고, 단독으로도 실행할 수 있다."
            fields:
              - label: 실패(빌드 중단)
                text: 모르는 키, 중복 id, 끊긴 id 참조(엣지의 `from`·`to`, 항목 간 상호참조, 블록의 `ledger`)
              - label: 실패(빌드 중단)
                text: 해설 필드에 근거 참조가 없는 경우
              - label: 실패(빌드 중단)
                text: "`viewer.yml` 안에 상태 값이 있는 경우"
              - label: 실패(빌드 중단)
                text: "원장: 완료에 증거가 없는 경우, 완료를 기본값으로 쓴 경우, 필수 항목이 미완인데 단계가 완료인 경우"
              - label: 실패(빌드 중단)
                text: 원장과 `viewer.yml`의 id 불일치
              - label: 실패(빌드 중단)
                text: "`primary` 원본 누락, 근거 참조 해소 실패"
              - label: 실패(빌드 중단)
                text: 볼트 밖을 가리키는 경로, 절대경로, `sources`에 없는 경로
              - label: 경고(집계해 스탬프에 숫자로 표시)
                text: "`reference` 원본 누락 수"
              - label: 경고(집계해 스탬프에 숫자로 표시)
                text: 원문 md 안의 링크 중 `sources` 범위 밖이라 해소되지 않은 수
              - label: 경고(집계해 스탬프에 숫자로 표시)
                text: 로컬에 없어 존재를 확인하지 못한 저장소 코드 근거 수
              - label: 경고(집계해 스탬프에 숫자로 표시)
                text: 자기 근거 없이 블록 근거를 물려받은 해설 항목 수
            evidence: [{source: design, at: "검사 규칙"}]
          - id: R-fidelity
            label: 충실도 검사
            tags: [해설, 검사]
            body: '"해설은 원본 문장에서만"을 기계로 검사하는 선택 모드다. 문장 단위(정규화한 길이가 8 미만이면 세지 않는다)로 넷 중 하나로 판정한다:'
            fields:
              - label: 완전 일치
                text: 정규화한 문장이 그 해설에 근거로 건 원본들의 정규화 본문에 그대로 있다
              - label: 다듬음
                text: 완전 일치는 아니지만 10자 창(문자 단위 슬라이딩)의 85% 이상이 근거로 건 원본들에 있고, 문장 안의 모든 숫자 문맥도 그 원본에 그대로 있다. 다듬음 문장마다 경고 `W_FIDELITY_TRIMMED`가 1건 나온다(종료 코드는 바꾸지 않는다).
              - label: 다른 원본
                text: 위 조건(창 85% 이상 + 숫자 문맥 일치)을 **등록된 다른 원본 전체**에 대해서는 만족한다 → 경고 `W_FIDELITY_ELSEWHERE`.
              - label: 미일치
                text: 원본 어디에도 없다 → 오류 `E_FIDELITY`.
              - label: 한계
                text: 통과(완전 일치·다듬음)는 그 문자열이 원본에 있다는 것만 보장한다. 문맥이 맞는지는 사람이 읽고 판단해야 한다.
            evidence: [{source: schema, at: "충실도 검사 (선택 모드)"}]
      - type: table
        id: B-rules-table
        title: 오류 코드
        expect_count: 20
        evidence: [{source: schema, at: "오류 코드"}]
        columns:
          - {id: code, label: 코드}
          - {id: meaning, label: 뜻}
        rows:
          - {id: E_YAML, cells: {code: E_YAML, meaning: "YAML 파싱 실패"}}
          - {id: E_SCHEMA, cells: {code: E_SCHEMA, meaning: "형식 위반(모르는 키, 누락, 타입, id 형식, `schema_version`)"}}
          - {id: E_DUP_ID, cells: {code: E_DUP_ID, meaning: "중복 id"}}
          - {id: E_BROKEN_REF, cells: {code: E_BROKEN_REF, meaning: "끊긴 id 참조(엣지, `refs`, `parent`, `group`)"}}
          - {id: E_TREE_CYCLE, cells: {code: E_TREE_CYCLE, meaning: "`tree`의 순환"}}
          - {id: E_PATH, cells: {code: E_PATH, meaning: "절대경로, 볼트 밖, `..` 탈출"}}
          - {id: E_SOURCE_UNKNOWN, cells: {code: E_SOURCE_UNKNOWN, meaning: "근거가 등록되지 않은 원본 id를 가리킴"}}
          - {id: E_SOURCE_MISSING, cells: {code: E_SOURCE_MISSING, meaning: "`primary`·`ledger` 원본 파일 없음"}}
          - {id: E_REF_UNRESOLVED, cells: {code: E_REF_UNRESOLVED, meaning: "`at`·`lines`·`find` 해소 실패"}}
          - {id: E_NO_EVIDENCE, cells: {code: E_NO_EVIDENCE, meaning: "해설에 근거 없음"}}
          - {id: E_COUNT, cells: {code: E_COUNT, meaning: "`expect_count` 불일치"}}
          - {id: E_KIND, cells: {code: E_KIND, meaning: "`kind: project`인데 `stages` 없음, `ledger` 2개 이상 등"}}
          - {id: E_LEDGER, cells: {code: E_LEDGER, meaning: "원장 규칙 위반(위 1~8). 증거 파일 누락 포함. 증거의 `at`·`lines`·`find` 해소 실패는 `E_REF_UNRESOLVED`"}}
          - {id: W_REFERENCE_MISSING, cells: {code: W_REFERENCE_MISSING, meaning: "`reference` 원본 없음"}}
          - {id: W_CODE_UNVERIFIED, cells: {code: W_CODE_UNVERIFIED, meaning: "저장소 코드 근거를 로컬에서 확인하지 못함"}}
          - {id: W_LINK_UNRESOLVED, cells: {code: W_LINK_UNRESOLVED, meaning: "원문 md 안의 링크가 `sources` 범위 밖이라 해소되지 않음(건마다 1건, 빌드 때 집계)"}}
          - {id: W_INHERITED, cells: {code: W_INHERITED, meaning: "블록 근거를 물려받은 항목이 있는 블록(집계용, **블록마다 1건**. 메시지에 물려받은 항목 수와 종류별 내역을 적는다. 스탬프의 `inheritedEvidence`는 항목 수 그대로다)"}}
          - {id: E_FIDELITY, cells: {code: E_FIDELITY, meaning: "해설 문장이 근거로 건 원본 어디에도 없다(`--fidelity`일 때만 나온다)"}}
          - {id: W_FIDELITY_ELSEWHERE, cells: {code: W_FIDELITY_ELSEWHERE, meaning: "해설 문장이 근거로 건 원본이 아니라 등록된 다른 원본에 있다(`--fidelity`일 때만 나온다)"}}
          - {id: W_FIDELITY_TRIMMED, cells: {code: W_FIDELITY_TRIMMED, meaning: "해설 문장이 다듬어졌다(창 85% 이상 + 숫자 문맥 일치, `--fidelity`일 때만 나온다, 다듬음 문장마다 1건, 눈으로 원문과 대조한다)"}}

  - id: P-roadmap
    title: 단계
    blocks:
      - type: stages
        id: B-stages
        title: 웨이브 W0~W6
        stages:
          - id: W0
            title: 프로젝트 뼈대, 스펙, 공유 계약 동결, 작업 브랜치
            short: W0 뼈대
            owner: 코디네이터
            output: "docs/, README.md"
            detail: {source: supervision, at: "웨이브"}
          - id: W1
            title: 종이 이식 3건 병렬
            short: W1 종이 이식
            owner: "경량 ×3"
            output: "outputs/paper-migration/<n>/"
            detail: {source: supervision, at: "G1 스키마 동결"}
            items:
              - {id: W1.tally, label: 종이 이식 집계를 실제 화면과 대조한다, evidence: [{source: supervision, at: "G1 스키마 동결"}]}
              - {id: W1.freeze, label: "'담지 못함' 목록에서 블록 어휘와 필드를 확정해 docs/schema.md로 동결한다", evidence: [{source: supervision, at: "G1 스키마 동결"}]}
          - id: W2
            title: "model: 스키마·검사기·check CLI"
            short: W2 검사기
            owner: 상위
            output: "config/shell/model/, config/shell/tests/model/"
            detail: {source: supervision, at: "G2 검사기"}
            items:
              - {id: W2.tests, label: 구현자의 테스트를 코디네이터가 직접 재실행한다, evidence: [{source: supervision, at: "G2 검사기"}]}
              - {id: W2.probe, label: 변이 탐침 — 미리 주지 않은 망가진 입력을 넣어 check가 실패하는지 본다. 하나라도 통과해 버리면 WP를 반려한다, evidence: [{source: supervision, at: "G2 검사기"}]}
              - {id: W2.normal, label: 정상 입력이 통과하는지도 본다, evidence: [{source: supervision, at: "G2 검사기"}]}
          - id: W3
            title: loader · reader · blocks+앱 골격 병렬
            short: W3 셸
            owner: "상위 ×3"
            output: 각자의 디렉터리
            detail: {source: supervision, at: "웨이브"}
            items:
              - {id: W3.rerun, label: 패키지별 재실행, evidence: [{source: supervision, at: "웨이브"}]}
          - id: W4
            title: "자기 적용: viewer.yml과 상태 원장"
            short: W4 자기 적용
            owner: 경량
            output: "config/viewer.yml, docs/status.yml"
            detail: {source: supervision, at: "웨이브"}
            items:
              - {id: W4.check, label: check 통과, evidence: [{source: supervision, at: "웨이브"}]}
              - {id: W4.sample, label: 표본 대조, evidence: [{source: supervision, at: "웨이브"}]}
          - id: W5
            title: 스킬 2개, 보기 가이드, README
            short: W5 스킬
            owner: 경량
            output: "config/skills/, docs/view-guide.md"
            detail: {source: supervision, at: "웨이브"}
            items:
              - {id: W5.scan, label: 볼트 중립 스캔, evidence: [{source: supervision, at: "웨이브"}]}
          - id: W6
            title: 통합과 E2E
            short: W6 통합
            owner: 코디네이터
            detail: {source: supervision, at: "G3 브라우저 실측"}
            items:
              - {id: W6.open, label: 산출 HTML을 file://과 정적 서버 양쪽에서 연다, evidence: [{source: supervision, at: "G3 브라우저 실측"}]}
              - {id: W6.links, label: 페이지의 모든 내부 링크와 근거 버튼을 스크립트로 전수 이동시켜 목적지가 실제로 있는지 확인한다. 누락 0건, evidence: [{source: supervision, at: "G3 브라우저 실측"}]}
              - {id: W6.hash, label: 샌드박스 iframe 안에서 해시 이동이 동작한다, evidence: [{source: supervision, at: "G3 브라우저 실측"}]}
              - {id: W6.console, label: 콘솔 오류 0건, evidence: [{source: supervision, at: "G3 브라우저 실측"}]}
              - {id: W6.responsive, label: "390px과 1440px 폭, 라이트와 다크 테마", evidence: [{source: supervision, at: "G3 브라우저 실측"}]}
              - {id: W6.stamp, label: 스탬프의 커밋과 지문이 실제 값과 일치한다, evidence: [{source: supervision, at: "G3 브라우저 실측"}]}
              - {id: W6.report, label: "결과와 증빙을 outputs/<날짜>-verification.md에 남긴다", evidence: [{source: supervision, at: "G3 브라우저 실측"}]}

  - id: P-findings
    title: 발견
    blocks:
      - type: table
        id: B-findings
        title: 기존 뷰어 실측과 설계 대응
        expect_count: 12
        evidence: [{source: design, at: "기존 뷰어 실측과 설계 대응"}]
        columns:
          - {id: finding, label: 발견}
          - {id: response, label: 이 설계의 대응}
        rows:
          - {id: F1, cells: {finding: "리더 계층(md 렌더·링크 해석·mermaid·지문·빌드 설정)을 뷰어마다 새로 구현, 공유 0", response: 셸 한 벌}}
          - {id: F2, cells: {finding: 중간 파일 방식이 네 가지. 손으로 옮겨 쓴 상수는 원본이 바뀌어도 잡지 못함, response: "원본은 빌드 때 직접 읽음. yml에는 포인터와 해설만"}}
          - {id: F3, cells: {finding: 근거 연결 키가 제각각이고 대부분 미검증, response: "근거 참조 4형태 + 빌드 때 전건 해소"}}
          - {id: F4, cells: {finding: "링크 결함이 최다 재발(404, iframe 해시 무반응, `hashchange` 미청취)", response: "범위 밖 링크 미생성, 해시 라우터 공용화, G3 전수 이동"}}
          - {id: F5, cells: {finding: "완료 선언과 실측의 불일치, 테스트 거짓 통과", response: 감독 절차서의 재실행·변이 탐침}}
          - {id: F6, cells: {finding: "신선도 표시가 고르지 않음(하드코딩 날짜 포함)", response: 전자동 스탬프}}
          - {id: F7, cells: {finding: 상태 모델 수준 차가 큼, response: "상태 원장 + 완료엔 증거 필수 + 기본값 완료 금지"}}
          - {id: F8, cells: {finding: md 렌더 함정 6가지, response: "md 렌더 규칙 + 회귀 테스트"}}
          - {id: F9, cells: {finding: "볼트 루트 공용 모듈에 대한 암묵 의존, CDN 의존", response: "셸 자기완결, 런타임 외부 네트워크 없음"}}
          - {id: F10, cells: {finding: "만드는 쪽·보는 쪽 문서 미분리, 보기 스킬 부재", response: 스킬 2개 분리}}
          - {id: F11, cells: {finding: 좌표 하드코딩 그림은 확장에 약함, response: 데이터 주도 자동 레이아웃}}
          - {id: F12, cells: {finding: 테스트가 있는 뷰어는 모두 순수 함수를 분리해 둠, response: 테스트 전략}}

  - id: P-decisions
    title: 결정
    blocks:
      - type: items
        id: B-decisions
        title: 결정 기록
        expect_count: 8
        evidence: [{source: design, at: "결정 기록"}]
        items:
          - id: D1
            label: "위치는 projects/project-viewer/, 본문은 볼트 중립으로 쓴다"
            body: 소유자 결정
          - id: D2
            label: 읽기 전용 뷰어만 다룬다
            body: 소유자 결정. 입력 도구는 공유 코드가 없는 다른 계통
          - id: D3
            label: 첫 적용 대상은 이 프로젝트 자신
            body: 소유자 결정. 과적합은 종이 이식 게이트로 막는다
          - id: D4
            label: 공용 셸 + 프로젝트별 yml
            body: 소유자 결정. 발견사항 대부분이 같은 문제를 매번 새로 푼 데서 나옴
          - id: D5
            label: "상태는 viewer.yml이 아니라 원본(frontmatter·원장)에서만 읽는다"
            body: 파생물이 진실원이 되는 것을 구조로 막기 위해
          - id: D6
            label: 그래프 기본 레이아웃은 자체 구현(그룹 밴드)
            body: 외부 의존 없이 순수 함수로 테스트 가능. 임의 그래프용 계층 레이아웃은 필요해질 때 추가
          - id: D7
            label: "G1 스키마 동결 — 블록 8종, 범용 fields, 블록 근거 물려받기, 저장소 코드 원본"
            body: "종이 이식 3건의 집계 (`outputs/`의 G1 기록)"
          - id: D8
            label: 의존성은 셸 로컬 매니페스트에 전부 선언
            body: 배포되는 도구는 볼트 루트 공용 모듈에 기대면 안 된다는 볼트 규칙
